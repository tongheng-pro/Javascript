    const data = async function () {
        const res = await fetch('https://fakestoreapi.com/products');
        const req = await res.json();
        req.map(e =>{
            // document.getElementById('content').innerHTML = e.title;
             document.getElementById('content').innerHTML += `
              
                    <tr>
                        <td>${e.title}</td>
                        <td><img src="${e.image}" alt="" width='50px'></td>
                    </tr>
             
             `;
            console.log(e.title);
        });
        console.log()
    }
    data();
</script>
